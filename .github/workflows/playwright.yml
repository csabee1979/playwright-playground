name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      browser:
        description: Browser project to run
        type: choice
        options:
          - all
          - chromium
          - firefox
          - webkit
        default: chromium
      test_filter:
        description: Optional Playwright grep (e.g. has title)
        required: false
        type: string
      deploy_report:
        description: Deploy HTML report to GitHub Pages
        type: boolean
        default: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm install -g pnpm && pnpm install
      - name: Install Playwright Browsers
        shell: bash
        run: |
          BROWSER="${{ github.event_name == 'workflow_dispatch' && inputs.browser || 'all' }}"
          if [ "$BROWSER" = "all" ]; then
            pnpm exec playwright install --with-deps
          else
            pnpm exec playwright install --with-deps "$BROWSER"
          fi
      - name: Run Playwright tests
        shell: bash
        env:
          TEST_FILTER: ${{ github.event_name == 'workflow_dispatch' && inputs.test_filter || '' }}
        run: |
          BROWSER="${{ github.event_name == 'workflow_dispatch' && inputs.browser || 'all' }}"
          ARGS=()
          if [ "$BROWSER" != "all" ]; then
            ARGS+=(--project="$BROWSER")
          fi
          if [ -n "$TEST_FILTER" ]; then
            ARGS+=(--grep="$TEST_FILTER")
          fi
          pnpm exec playwright test "${ARGS[@]}"

      - name: Restore previous Allure trend history
        if: always()
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Prepare Allure history for trends
        if: always()
        shell: bash
        run: |
          mkdir -p allure-results
          HISTORY_SRC="gh-pages/allure/latest/history"
          HISTORY_DST="allure-results/history"
          if [ -d "$HISTORY_SRC" ]; then
            mkdir -p "$HISTORY_DST"
            cp -R "$HISTORY_SRC/." "$HISTORY_DST/"
            echo "Allure history restored from gh-pages."
          else
            echo "No previous Allure history found."
          fi

      - name: Generate Allure report
        if: always()
        run: pnpm run allure:generate

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

  deploy-report:
    needs: test
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.deploy_report)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages-deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Download Playwright report
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

      - name: Download Allure report
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Publish Playwright and Allure reports (single commit)
        shell: bash
        run: |
          SITE="site"
          RUN_ID="${{ github.run_id }}"
          DATE=$(date +'%Y-%m-%d')
          FOLDER_NAME="$DATE-$RUN_ID"
          PLAYWRIGHT_DEST="$SITE/reports/$FOLDER_NAME"
          PLAYWRIGHT_LATEST="$SITE/reports/latest"
          ALLURE_DEST="$SITE/allure/$FOLDER_NAME"
          ALLURE_LATEST="$SITE/allure/latest"

          touch "$SITE/.nojekyll"
          mkdir -p "$PLAYWRIGHT_DEST" "$ALLURE_DEST"
          cp -R "playwright-report/." "$PLAYWRIGHT_DEST/"
          cp -R "allure-report/." "$ALLURE_DEST/"

          rm -rf "$PLAYWRIGHT_LATEST" "$ALLURE_LATEST"
          cp -R "$PLAYWRIGHT_DEST" "$PLAYWRIGHT_LATEST"
          cp -R "$ALLURE_DEST" "$ALLURE_LATEST"

          prune_by_days() {
            REPORTS_DIR="$1"
            RETAIN_DAYS="$2"
            CUTOFF_DATE=$(date -d "$RETAIN_DAYS days ago" +%s)
            find "$REPORTS_DIR" -mindepth 1 -maxdepth 1 -type d | while read -r dir; do
              BASENAME=$(basename "$dir")
              if [[ "$BASENAME" =~ ^([0-9]{4}-[0-9]{2}-[0-9]{2})-[0-9]+$ ]]; then
                DIR_DATE="${BASH_REMATCH[1]}"
                DIR_TIMESTAMP=$(date -d "$DIR_DATE" +%s)
                if [ "$DIR_TIMESTAMP" -lt "$CUTOFF_DATE" ]; then
                  rm -rf "$dir"
                fi
              fi
            done
          }

          prune_by_days "$SITE/reports" 5
          prune_by_days "$SITE/allure" 5

          cd "$SITE"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Add Playwright + Allure reports for run ${{ github.run_id }}" || echo "Nothing to commit"
          git push origin gh-pages

      - name: Add summary links
        shell: bash
        run: |
          BASE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          DATE=$(date +'%Y-%m-%d')
          RUN_ID="${{ github.run_id }}"
          {
            echo "### 📄 [Playwright report (this run)]($BASE_URL/reports/$DATE-$RUN_ID/)"
            echo "### 🔁 [Playwright latest]($BASE_URL/reports/latest/)"
            echo "### 📊 [Allure report (this run)]($BASE_URL/allure/$DATE-$RUN_ID/)"
            echo "### 🔁 [Allure latest]($BASE_URL/allure/latest/)"
          } >> "$GITHUB_STEP_SUMMARY"
