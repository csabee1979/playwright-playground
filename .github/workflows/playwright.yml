name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      browser:
        description: Browser project to run
        type: choice
        options:
          - all
          - chromium
          - firefox
          - webkit
        default: chromium
      test_filter:
        description: Optional Playwright grep (e.g. has title)
        required: false
        type: string
      deploy_report:
        description: Deploy HTML report to GitHub Pages
        type: boolean
        default: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm install -g pnpm && pnpm install
      - name: Install Playwright Browsers
        shell: bash
        run: |
          BROWSER="${{ github.event_name == 'workflow_dispatch' && inputs.browser || 'all' }}"
          if [ "$BROWSER" = "all" ]; then
            pnpm exec playwright install --with-deps
          else
            pnpm exec playwright install --with-deps "$BROWSER"
          fi
      - name: Run Playwright tests
        shell: bash
        env:
          TEST_FILTER: ${{ github.event_name == 'workflow_dispatch' && inputs.test_filter || '' }}
        run: |
          BROWSER="${{ github.event_name == 'workflow_dispatch' && inputs.browser || 'all' }}"
          ARGS=()
          if [ "$BROWSER" != "all" ]; then
            ARGS+=(--project="$BROWSER")
          fi
          if [ -n "$TEST_FILTER" ]; then
            ARGS+=(--grep="$TEST_FILTER")
          fi
          pnpm exec playwright test "${ARGS[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  deploy-report:
    needs: test
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.deploy_report)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages-deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout deploy action
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions/deploy-report
          fetch-depth: 1

      - name: Download Playwright report
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

      - uses: ./.github/actions/deploy-report
        id: deploy
        with:
          report-path: playwright-report
